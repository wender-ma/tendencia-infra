<div class="kpis history-kpis" id="histKpis"></div>

<div class="card history-chart-card history-data-section">
  <h2 class="detail-heading">
    <span>📈 Evolução do total da obra</span>
    <span class="hint">Orçamento Licitação → cada gestão</span>
  </h2>
  <div id="histChart" class="history-chart"></div>
  <div id="histLegend" class="history-legend"></div>
</div>

<div class="grid-2 history-ranking-grid history-data-section">
  <div class="card">
    <h2>
      <span>📈 Top 10 · Maiores aumentos</span>
      <span class="hint">vs Licitação</span>
    </h2>
    <div id="histTopUp"></div>
  </div>
  <div class="card">
    <h2>
      <span>📉 Top 10 · Maiores reduções</span>
      <span class="hint">vs Licitação</span>
    </h2>
    <div id="histTopDown"></div>
  </div>
</div>

<div class="card history-heatmap-card history-data-section">
  <div class="history-heatmap-toolbar">
    <h2 class="history-heatmap-title">🌡️ Mapa de variações por item</h2>
    <div class="toolbar history-heatmap-filters">
      <input
        type="search"
        id="histSearch"
        aria-label="Buscar no histórico"
        placeholder="🔍 Buscar insumo ou item..."
      />
      <select id="histCompare" aria-label="Modo de comparação do histórico">
        <option value="first" selected>Comparar vs Licitação</option>
        <option value="auto">Comparar cada gestão vs anterior</option>
      </select>
      <label class="checkbox-label">
        <input type="checkbox" id="histOnlyChanged" checked />
        Só itens que mudaram
      </label>
      <span class="toolbar-count" id="histCount"></span>
    </div>
  </div>

  <div class="table-wrap history-table-wrap">
    <table id="histTbl">
      <thead id="histThead"></thead>
      <tbody id="histTbody"></tbody>
    </table>
  </div>
  <div
    class="table-pagination"
    id="historyPagination"
    hidden
    aria-label="Paginação do histórico"
  ></div>
</div>
