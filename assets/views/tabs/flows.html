  <div class="grid-3 flow-summary-grid">
    <div class="card flow-summary-card" id="flowSummary">
      <h2>📊 Resumo dos Aditivos <span class="hint">por situação</span></h2>
      <div id="flowSummaryBars"></div>
    </div>
    <div class="card">
      <h2>🥧 Classificação dos Aditivos <span class="hint">por tipo de impacto na obra</span></h2>
      <div id="flowsByTipo"></div>
      <div id="flowsDescartados" class="flows-discarded"></div>
    </div>
    <div class="card">
      <h2>🎯 Top Motivos <span class="hint">somente Finalizados + Obra/Orçamento/Planej.</span></h2>
      <div id="flowsByMotivo"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="detail-heading">
      <span>📋 Aditivos detalhados</span>
      <span class="panel-actions detail-actions">
        <button class="btn-sm primary" data-editor-only data-click-action="openManualForm" title="Adiciona um item que ainda não existe em Flow">➕ Novo aditivo</button>
        <button class="btn-sm primary" data-click-action="exportarFlowsXLSX" title="Exporta a tabela completa de aditivos em Excel">💾 Exportar Excel</button>
        <button class="btn-sm" data-click-action="exportClassifications" title="Baixa CSV apenas com as alterações manuais feitas (edições de INSUMO_*)">📤 Exportar alterações</button>
        <button class="btn-sm" data-click-action="reloadClassifications" title="Recarrega do navegador">⤴️ Recarregar</button>
      </span>
    </h2>
    <div class="toolbar flows-filter-toolbar">
      <input type="search" id="flowSearch" aria-label="Buscar aditivos por descrição ou número do Flow" placeholder="🔍 Descrição ou nº Flow...">
      <div class="ms-wrap" id="ms_refletido_wrap"><button type="button" class="ms-btn" id="ms_refletido_btn" data-click-action="msToggle" data-action-mode="arg" data-action-arg="refletido">Todos status</button><div class="ms-panel" id="ms_refletido_panel"></div></div>
      <div class="ms-wrap" id="ms_dep_wrap"><button type="button" class="ms-btn" id="ms_dep_btn" data-click-action="msToggle" data-action-mode="arg" data-action-arg="dep">Todos departamentos</button><div class="ms-panel" id="ms_dep_panel"></div></div>
      <div class="ms-wrap" id="ms_destino_wrap"><button type="button" class="ms-btn" id="ms_destino_btn" data-click-action="msToggle" data-action-mode="arg" data-action-arg="destino">Todos destinos</button><div class="ms-panel" id="ms_destino_panel"></div></div>
      <div class="ms-wrap" id="ms_origem_wrap"><button type="button" class="ms-btn" id="ms_origem_btn" data-click-action="msToggle" data-action-mode="arg" data-action-arg="origem">Todas origens</button><div class="ms-panel" id="ms_origem_panel"></div></div>
      <label class="advanced-filter-field">
        📅 De:
        <input type="month" id="flowFilterDataIni" class="flow-filter-control">
      </label>
      <label class="advanced-filter-field">
        até:
        <input type="month" id="flowFilterDataFim" class="flow-filter-control">
      </label>
      <label class="advanced-filter-field">
        💰 R$:
        <input type="number" id="flowFilterValMin" class="flow-filter-control flow-filter-number" aria-label="Valor mínimo" placeholder="mín" step="100">
        <input type="number" id="flowFilterValMax" class="flow-filter-control flow-filter-number" aria-label="Valor máximo" placeholder="máx" step="100">
      </label>
      <button class="btn-sm compact" data-click-action="clearFlowFilters">🧹 Limpar filtros</button>
    </div>
    <div id="massBar" class="is-hidden"></div>
    <div class="table-wrap">
      <table class="flows-table">
        <thead>
          <tr>
            <th class="table-col-30"><input type="checkbox" id="flowSelectAll" data-edit-control data-change-action="toggleSelectAllVisible" data-action-mode="self" title="Selecionar/desmarcar todos os visíveis" aria-label="Selecionar ou desmarcar todos os aditivos visíveis" class="selection-checkbox"></th>
            <th class="table-col-110" title="Status de reflexo no planejamento da obra">Refletido?</th>
            <th class="table-col-55" data-sort-flow="n_alteracao" aria-sort="none">Nº</th>
            <th class="table-col-90" data-sort-flow="data" aria-sort="none">Data</th>
            <th class="table-col-110" data-sort-flow="dep" aria-sort="none">Departamento</th>
            <th class="table-col-120" data-sort-flow="tipo" aria-sort="none">Tipo</th>
            <th class="table-col-180" data-sort-flow="insumo_planejamento" aria-sort="none">→ Destino</th>
            <th class="table-col-180" data-sort-flow="insumo_remanejamento" aria-sort="none">← Origem</th>
            <th class="num table-col-130" data-sort-flow="custo_flowmaster" aria-sort="none">Fluxo Planejamento</th>
            <th data-sort-flow="motivo" aria-sort="none">Motivo / Descrição</th>
          </tr>
        </thead>
        <tbody id="flowTbody"></tbody>
      </table>
    </div>
  </div>
